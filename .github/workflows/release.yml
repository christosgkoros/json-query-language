name: Release

# Nothing is published from this repository yet — see the "Status" section of
# the README. Until the name is settled there is no artifact worth shipping to
# a registry, so this workflow only *checks* a release: it runs the test suite
# and asserts the release tag agrees with package.json.
#
# The publish jobs (npmjs.com and GitHub Packages, both with the
# already-published guard) were removed in the 0.3.0 cycle. To bring them back,
# restore them from git history rather than rewriting them:
#
#   git log --oneline -- .github/workflows/release.yml
on:
  release:
    types: [published]
  workflow_dispatch:

# No ambient permissions; each job asks for exactly what it needs.
permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check the tag matches package.json
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A release tag that disagrees with package.json means the repository
          # and the release notes would describe different things.
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${version}'."
            exit 1
          fi

      - name: Summarise
        run: |
          {
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${{ steps.resolve.outputs.version }}\` |"
            echo "| Published to | _nothing — this repository ships no artifacts yet_ |"
          } >> "$GITHUB_STEP_SUMMARY"
